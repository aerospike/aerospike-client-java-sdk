name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev/*, stage, init]

permissions:
  id-token: write
  contents: read
  actions: read  

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  make-matrix:
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
    outputs:
      input-matrix: ${{ steps.create-server-matrix.outputs.input-matrix }}
      java-version: ${{ steps.extract-java.outputs.java_version }}
    steps:
      - uses: actions/checkout@v4

      - id: create-server-matrix
        shell: bash
        env:
          DEFAULT_JSON: ${{ vars.DEFAULT_SERVER_VERSIONS }}
          TEST_SERVERS_FILE_PATH: ${{ vars.TEST_SERVERS_FILE_PATH }}
        run: |
          set -euo pipefail

          FILE="${TEST_SERVERS_FILE_PATH:-}"

          if [[ -n "${FILE}" && -s "${FILE}" ]]; then
            echo "Using ${FILE} from repository"
            JSON="$(cat "${FILE}")"
          else
            echo "${FILE:-<unset>} missing or empty – using default_json input"
            JSON="${DEFAULT_JSON}"
          fi

          echo "${JSON}" | jq . >/dev/null

          MATRIX="$(echo "${JSON}" | jq -c '[to_entries[] | { server: .key } + .value]')"

          {
            echo "input-matrix<<__JSON__"
            echo "${MATRIX}"
            echo "__JSON__"
          } >> "$GITHUB_OUTPUT"

      - name: Extract Java version from pom.xml
        id: extract-java
        run: |
          DEFAULT_VERSION=21
          VERSION=$(grep -m1 -E '<(maven.compiler.source|java.version)>' pom.xml | sed -E 's/.*>(.*)<.*/\1/')
          if [ -z "$VERSION" ]; then
            echo "Could not detect Java version, defaulting to $DEFAULT_VERSION"
            VERSION=$DEFAULT_VERSION
          fi
          echo "Detected Java version: $VERSION"
          echo "java_version=$VERSION" >> $GITHUB_OUTPUT

  integration-test:
    name: test-${{ matrix.server }}-${{ matrix.num-nodes }}node
    needs: make-matrix
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.make-matrix.outputs.input-matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ vars.JAVA_DISTRIBUTION }} ${{ needs.make-matrix.outputs.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ vars.JAVA_DISTRIBUTION }}
          java-version: ${{ needs.make-matrix.outputs.java-version }}
          cache: maven

      - name: Show Java & Maven
        run: |
          java -version
          mvn -v

      - name: Setup Aerospike Server (${{ matrix.num-nodes }} node)
        uses: aerospike/shared-workflows/.github/actions/setup-aerospike-server@7f563f650178064e0c0cedde00277226bfb131de # main
        with:
          server-tag: ${{ matrix.version }}
          server-container-repo: ${{ matrix.type }}
          num-nodes: ${{ matrix.num-nodes }}
          oidc-provider: ${{ vars.OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE }}
          config-content: |
            service {
                feature-key-file /etc/aerospike/features.conf
                cluster-name docker
                proto-fd-max 15000
            }

            logging {
                console {
                    context any info
                }
            }

            network {
                service {
                    address any
                    port 3000
                }
                heartbeat {
                    mode mesh
                    port 3002
                }
                fabric {
                    port 3001
                }
            }

            namespace test {
              replication-factor 1
              allow-ttl-without-nsup true
              storage-engine memory { 
                data-size 4G 
              }
            }

      - name: Build & run integration tests
        run: |
          mvn \
           --batch-mode \
           --no-transfer-progress \
           --update-snapshots \
           --fail-at-end \
           --errors \
           verify \
           -DskipTests=false
        env:
          MAVEN_OPTS: ${{ vars.MAVEN_OPTS }}

      - name: Build & run examples
        run: |
          mvn \
           --batch-mode \
           --no-transfer-progress \
           --update-snapshots \
           --fail-at-end \
           --errors \
           -pl examples \
           -am \
           package \
           -DskipTests

          # Run from the examples module so that examples which load YAML via
          # relative paths (src/main/resources/*.yml) resolve their config files.
          cd examples
          java -jar target/*-jar-with-dependencies.jar all \
           -h 127.0.0.1 \
           -p 3000 \
           -n test \
           --report target/example-reports/TEST-examples.xml
        env:
          MAVEN_OPTS: ${{ vars.MAVEN_OPTS }}

      - name: JaCoCo coverage summary
        if: always()
        run: |
          python3 <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def counter_pct(counters, counter_type):
              for counter in counters:
                  if counter.get("type") == counter_type:
                      missed = int(counter.get("missed", "0"))
                      covered = int(counter.get("covered", "0"))
                      total = missed + covered
                      return (100.0 * covered / total) if total else None
              return None

          def fmt_pct(value):
              return "n/a" if value is None else f"{value:.1f}%"

          reports = sorted(Path(".").glob("**/target/site/jacoco/jacoco.xml"))
          if not reports:
              print("No JaCoCo report found (tests may have been skipped).")
              sys.exit(0)

          lines = ["## JaCoCo coverage", ""]
          for report_path in reports:
              module = report_path.parts[0] if len(report_path.parts) > 3 else str(report_path)
              root = ET.parse(report_path).getroot()
              packages = []
              for package in root.findall("package"):
                  name = package.get("name", "").replace("/", ".")
                  line_pct = counter_pct(package.findall("counter"), "LINE")
                  branch_pct = counter_pct(package.findall("counter"), "BRANCH")
                  if line_pct is None and branch_pct is None:
                      continue
                  packages.append((name, line_pct, branch_pct))

              packages.sort(key=lambda row: row[0])
              lines.append(f"### {module}")
              lines.append("")
              lines.append("| Package | Line | Branch |")
              lines.append("| --- | ---: | ---: |")
              for name, line_pct, branch_pct in packages:
                  lines.append(f"| `{name}` | {fmt_pct(line_pct)} | {fmt_pct(branch_pct)} |")

              total_line = counter_pct(root.findall("counter"), "LINE")
              total_branch = counter_pct(root.findall("counter"), "BRANCH")
              lines.append(f"| **Total** | **{fmt_pct(total_line)}** | **{fmt_pct(total_branch)}** |")
              lines.append("")

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write("\n".join(lines))
              summary.write("\n")
          PY

      - name: Upload surefire/failsafe reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.server }}-${{ matrix.num-nodes }}node-jdk-${{ needs.make-matrix.outputs.java-version }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**
            examples/target/example-reports/**
          if-no-files-found: ignore
          retention-days: ${{ vars.ARTIFACT_RETENTION_DAYS }}
